[pytest]
testpaths = tests
python_files = *.py
pythonpath = .
addopts = -s --browser chromium --screenshot only-on-failure --full-page-screenshot --output reports
markers =
    title(name): test case name shown in the results and on the dashboard
    testcases(sheet): test case sheet in test_cases/ used by the tc fixture
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
